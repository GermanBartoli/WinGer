name: Verificar WinGer
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Pruebas sin escritorio y publicación
        shell: pwsh
        run: ./scripts/Probar.ps1
      - name: Conservar informe de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Informe-pruebas-WinGer
          path: artifacts/pruebas/informe.md
      - uses: actions/upload-artifact@v4
        with:
          name: WinGer-win-x64
          path: artifacts/WinGer-win-x64/
