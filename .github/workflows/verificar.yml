name: Verificar WinGer
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  compilar:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Ejecutar pruebas
        run: dotnet run --project tests/WinGer.Pruebas -c Release
      - name: Publicar ejecutable
        shell: pwsh
        run: ./scripts/Publicar.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: WinGer-win-x64
          path: artifacts/WinGer-win-x64/
